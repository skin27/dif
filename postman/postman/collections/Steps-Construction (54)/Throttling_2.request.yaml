$kind: http-request
url: https://{{INSTANCE}}.{{BASE_URI}}/test/inbound_http/regressiontests/Throttling_2
method: POST
body:
  type: text
  content: check
scripts:
  - type: afterResponse
    code: |-
      const expected = `<?xml version="1.0" encoding="UTF-8"?><Aggregated><line>1</line><line>2</line><line>3</line><line>4</line><line>5</line><line>6</line><line>7</line><line>8</line><line>9</line><line>10</line></Aggregated>`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t]/g, "")).to.eql(expected.replace(/[\r\n\t]/g, ""));   
      });
    language: text/javascript
order: 47000
