                  <samenvatting>'Eens, mijn zoon, zal dit alles van jou zijn.' Die belofte in deze welgemeende woorden, of bewoordingen van gelijke strekking, deed een vader aan zijn oudste zoon op een goede dag aan het begin van de jaren tachtig van de vorige eeuw. 'Dit alles' was daarbij een aanzienlijk deel van het boerenbedrijf dat de vader en moeder uitoefenden, een deel dat in ieder geval groot genoeg zou zijn voor de zoon om daar met de zijnen van te kunnen leven, en 'eens' zou het moment zijn dat de ouders zouden overlijden of dat bedrijf niet meer konden runnen. De zoon had het goed gehoord en begon niet lang daarna (na het eerst nog voltooien van zijn middelbare school) te werken op dat gedeelte van de boerderij dat later het zijne zou zijn, tegen een bedrag dat, na een iets hoger begin, vanaf 1996 veel lager lag dan het gebruikelijke loon.&lt;BR/&gt;                                                                                                                                                                                             </samenvatting>
