$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Replace_multiline"
method: POST
body:
  type: text
  content: |-
    """Line 1
    Line 2
    Line 3"""
scripts:
  - type: afterResponse
    code: |-
      const expected = `"""Line 1
      MULTILINE
      Line 3"""`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
      //    console.log('actual');
      //    console.log(actual.replace(/[\r\n\t]/g, ""));
      //    console.log('expected');
      //    console.log(expected.replace(/[\r\n\t]/g, ""));
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
    language: text/javascript
order: 82000
