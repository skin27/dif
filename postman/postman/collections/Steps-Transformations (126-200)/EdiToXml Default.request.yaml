  content: |-
    CUS~John^Doe~1901-01-07~john.doe@example.com
    CUS~John^Doe~1902-01-07~john.doe@example.com
    CUS~John^Doe~1903-01-07~john.doe@example.com
    CUS~John^Doe~1904-01-07~john.doe@example.com
