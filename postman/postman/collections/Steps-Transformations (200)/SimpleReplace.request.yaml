$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/SimpleReplace"
method: POST
headers:
  name: value
body:
  type: file
  content:
    src: simplereplace.xml
scripts:
  - type: afterResponse
    code: |-
      pm.test("Response time is less than 6500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(15000);
          });

      let responseSize=pm.response.size();
      pm.test("Verify response sizes",()=>{
          pm.expect(Number(responseSize.total)).to.below(355600);
          }
      );
    language: text/javascript
order: 112000
