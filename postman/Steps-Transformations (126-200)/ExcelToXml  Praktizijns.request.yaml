                  <coverlink>https://lms1.bibis.nl/praktizijn/covers/3088/9789013153088_20230119_170956.jpg</coverlink>
                  <samenvatting>Is de rechterlijke macht een zelfstandige en gelijkwaardige staatsmacht naast de machten regering en parlement? Deze titel geeft inzicht in de inrichting van de rechterlijke organisatie, het ambt van rechter en de uitoefening van de functie van de rechtspraak. Diverse actuele vraagstukken komen aan de orde, net als een analyse van de (grond) wettelijke regelingen. &lt;BR/&gt;&lt;BR/&gt;Zelden is in een overheidsorganisatie zoveel veranderd als de laatste twee decennia in de rechterlijke macht. Niet alleen de inrichting van de rechterlijke organisatie is ingrijpend gewijzigd, maar ook het bestuur en beheer van de gerechten. Dit gebeurde bij de herziening van de Wet RO in 2002 en opnieuw bij de Wet herziening gerechtelijke kaart in 2012. Ook de positie van de rechter in de samenleving is sterk veranderd. Was de rechtspraak vroeger een rustig bezit, dat voornamelijk in juridische kringen besproken werd, tegenwoordig staat Vrouwe Justitia volop ter discussie in de politiek en de maatschappij. &lt;BR/&gt;&lt;BR/&gt;Het gezag van de      rechter is bovendien minder vanzelfsprekend. Het vertrouwen van de burger in de rechtspraak staat niet meer bij voorbaat vast en politiek Den Haag heeft een bijzondere interesse ontwikkeld voor het functioneren van de rechterlijke macht. De onafhankelijkheid van de rechter staat daardoor vandaag de dag onder druk. &lt;BR/&gt;&lt;BR/&gt;Rechter, rechterlijke organisatie en rechtspraak in de democratische rechtsstaat beoogt uit een constitutioneel gezichtspunt inzicht te geven in de inrichting van de rechterlijke organisatie, het ambt van rechter en de uitoefening van de functie van de rechtspraak. Centraal staat de vraag of de rechterlijke macht een zelfstandige en gelijkwaardige staatsmacht is naast en tegenover de beide andere machten, namelijk regering en parlement. &lt;BR/&gt;&lt;BR/&gt;De huidige organisatiestructuur van de rechterlijke macht geeft wat dat betreft reden tot zorg. Recente ontwikkelingen maken duidelijk dat vanuit een oogpunt van rechterlijke onafhankelijkheid en machtenscheiding de positie van de rechter in het  staatsbestel onvoldoende gewaarborgd is. In deze titel wordt de beschrijving en analyse aan de hand van de (grond)wettelijke regelingen gecombineerd met de behandeling van diverse actuele vraagstukken.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </samenvatting>
