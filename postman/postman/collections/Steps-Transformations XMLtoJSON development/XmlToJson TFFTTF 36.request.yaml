$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=TFFTTF"
method: POST
queryParams:
  config: TFFTTF
body:
  type: xml
  content: |-
    <wcg>
        <dummy-node>issue 4.14</dummy-node>
        <testing>
            <dummy-node>issue 4.14</dummy-node>
            <tests>
                <dummy-node>issue 4.14</dummy-node>
                <waarde>123</waarde>
            </tests>
            <tests>
                <dummy-node>issue 4.14</dummy-node>
                <waarde>456</waarde>
            </tests>
        </testing>
    </wcg>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "wcg": {
              "dummy-node": "issue 4.14",
              "testing": {
                  "dummy-node": "issue 4.14",
                  "tests": [
                      {
                          "dummy-node": "issue 4.14",
                          "waarde": "123"
                      },
                      {
                          "dummy-node": "issue 4.14",
                          "waarde": "456"
                      }
                  ]
              }
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 1056000
