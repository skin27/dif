$kind: http-request
name: FLV Two Group
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/FLV_two_group"
method: POST
body:
  type: text
  content: |-
    YAYthin1
    YAYthin2
    YAYthin3
    YAYthin4
    YAYthin5
    HDRbody1234567890
    HDRbody2345678901
    HDRbody3456789012
    HDRbody4567890123
    HDRbody5678901234
    ABCline
    ABCline
    ABCline
    ABCline
    ABCline
scripts:
  - type: afterResponse
    code: |-
      const xml2js = require('xml2js');

      const expected = `<flv-message>
          <rule matchOn="YAY" fields="YAYheader[3]YAYbody[5]" />
          <rule matchOn="HDR" fields="HDRheader[3]HDRbody[5]" />
          <rule matchOn="ABC" fields="line1[3]line2[3]" />
          <group>
              <segment>
                  <YAYheader>YAY</YAYheader>
                  <YAYbody>thin1</YAYbody>
              </segment>
          </group>
          <group>
              <segment>
                  <YAYheader>YAY</YAYheader>
                  <YAYbody>thin2</YAYbody>
              </segment>
          </group>
          <group>
              <segment>
                  <YAYheader>YAY</YAYheader>
                  <YAYbody>thin3</YAYbody>
              </segment>
          </group>
          <group>
              <segment>
                  <YAYheader>YAY</YAYheader>
                  <YAYbody>thin4</YAYbody>
              </segment>
          </group>
          <group>
              <segment>
                  <YAYheader>YAY</YAYheader>
                  <YAYbody>thin5</YAYbody>
              </segment>
              <segment>
                  <HDRheader>HDR</HDRheader>
                  <HDRbody>body1</HDRbody>
              </segment>
              <segment>
                  <HDRheader>HDR</HDRheader>
                  <HDRbody>body2</HDRbody>
              </segment>
              <segment>
                  <HDRheader>HDR</HDRheader>
                  <HDRbody>body3</HDRbody>
              </segment>
              <segment>
                  <HDRheader>HDR</HDRheader>
                  <HDRbody>body4</HDRbody>
              </segment>
              <segment>
                  <HDRheader>HDR</HDRheader>
                  <HDRbody>body5</HDRbody>
              </segment>
          </group>
          <group>
              <segment>
                  <line1>ABC</line1>
                  <line2>lin</line2>
              </segment>
          </group>
          <group>
              <segment>
                  <line1>ABC</line1>
                  <line2>lin</line2>
              </segment>
          </group>
          <group>
              <segment>
                  <line1>ABC</line1>
                  <line2>lin</line2>
              </segment>
          </group>
          <group>
              <segment>
                  <line1>ABC</line1>
                  <line2>lin</line2>
              </segment>
          </group>
          <group>
              <segment>
                  <line1>ABC</line1>
                  <line2>lin</line2>
              </segment>
          </group>
      </flv-message>`;

      const actual = pm.response.text();

      // Sorteert zowel object-sleutels als de inhoud van arrays
      function canonicalSort(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              // 1. Sorteer eerst de inhoud van elk element in de array
              // 2. Sorteer daarna de array zelf op basis van de JSON-representatie
              return obj
                  .map(canonicalSort)
                  .sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
          }

          // Sorteer de sleutels van een object alfabetisch
          return Object.keys(obj).sort().reduce((acc, key) => {
              acc[key] = canonicalSort(obj[key]);
              return acc;
          }, {});
      }

      xml2js.parseString(expected, (err, result1) => {
          if (err) {
              pm.test('XML parsing error for expected xml', () => {
                  pm.expect(err).to.be.null;
              });
          } else {
              xml2js.parseString(actual, (err, result2) => {
                  if (err) {
                      pm.test('XML parsing error for actual xml', () => {
                          pm.expect(err).to.be.null;
                      });
                  } else {
                      const sorted1 = canonicalSort(result1);
                      const sorted2 = canonicalSort(result2);

                      pm.test('XML strings are equivalent, ignoring element order', () => {
                          pm.expect(sorted1).to.eql(sorted2);
                      });
                  }
              });
          }
      });
    language: text/javascript
order: 54000
