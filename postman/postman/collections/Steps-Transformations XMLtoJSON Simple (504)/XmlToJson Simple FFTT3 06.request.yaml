$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJsonSi\
  mple?config=FFTT3"
method: POST
queryParams:
  config: FFTT3
body:
  type: text
  content: |
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
        <products class="array">
            <product class="object">
                <id type="string">1</id>
            </product>
            <product class="object">
                <id type="string">2</id>
            </product>
        </products>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "products": {
              "product": [
                  {
                      "@class": "object",
                      "id": "1"
                  },
                  {
                      "@class": "object",
                      "id": "2"
                  }
              ],
              "@class": "array"
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 1500000
