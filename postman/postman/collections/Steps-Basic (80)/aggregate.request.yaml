method: POST
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: "const expected = `<persons>\r

      \t  <person>\r

      \t\t<name>Pedro Doe</name>\r

      \t  </person>\r

      \t  <person>\r

      \t\t<name>Jane Doe</name>\r

      \t  </person>\r

      \      <person>\r

      \t\t<name>Jaap Doe</name>\r

      \t  </person>\r

      \t  <person>\r

      \t\t<name>Peter Doe</name>\r

      \t  </person>\r

      </persons>`;\r

      \r

      const actual = pm.response.text();\r

      \r

      pm.test(\"happyflow\", function () {\r

      \    pm.response.to.not.be.error;\r

      \    pm.expect(actual.replace(/[\\r\\n\\t\\s]/g, \"\")).to.eql(expected.replace(/[\\r\\n\\t\\s]/g, \"\"));     \r

      });"
    language: text/javascript
order: 1000
