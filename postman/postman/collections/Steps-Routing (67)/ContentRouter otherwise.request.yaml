$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/ContentRouter"
method: POST
headers:
  name: Boa Constructor
body:
  type: json
  content: <emptyBody/>
scripts:
  - type: afterResponse
    code: |-
      const expected = `Otherwise`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t]/g, "")).to.eql(expected.replace(/[\r\n\t]/g, ""));    
      });
    language: text/javascript
order: 20000
