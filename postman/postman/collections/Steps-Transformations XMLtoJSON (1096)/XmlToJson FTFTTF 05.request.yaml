$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=FTFTTF"
method: POST
queryParams:
  config: FTFTTF
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
       <products class="array">
           <product class="object">
               <id type="number">1</id>
               <name type="string">spoon</name>
           </product>
       </products>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`[
          {
              "@class": "array",
              "product": {
                  "@class": "object",
                  "id": null,
                  "name": null
              }
          }
      ]`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 866000
