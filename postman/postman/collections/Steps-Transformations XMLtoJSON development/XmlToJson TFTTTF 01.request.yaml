$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?config=TFTTTF"
method: POST
queryParams:
  config: TFTTTF
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
        <products class="array">
            <product>
                <id type="string">1</id>
            </product>
            <product>
                <id type="string">2</id>
            </product>
        </products>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
        "noTransformation" : "Available"
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 193000
