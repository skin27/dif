$kind: http-request
name: archive
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/CB_Archive"
method: POST
headers:
  Content-Type: ""
scripts:
  - type: afterResponse
    code: "// const expected = `[Hello]`;\r

      \r

      // const actual = pm.response.text();\r

      \r

      // pm.test(\"happyflow\", function () {\r

      //     pm.response.to.not.be.error;\r

      //     pm.expect(actual).to.eql(expected);    \r

      // });\r

      \r

      var instance = pm.environment.name;\r

      var output = \"\";\r

      \r

      switch (instance) {\r

      \    case \"next\":\r

      \        output = '[{name=content.txt, content=Hello}]';\r

      \        break;\r

      \    default:\r

      \        output = '[Hello]';\r

      \        break;\r

      }\r

      \r

      //Check values in the console\r

      //console.log(instance);\r

      //console.log(output);\r

      \r

      const actual = pm.response.text();\r

      \r

      pm.test(\"happyflow\", function () {\r

      \    pm.expect(actual.replace(/[\\s]/g, \"\")).to.eql(output.replace(/[\\s]/g, \"\"));     \r

      });"
    language: text/javascript
order: 2000
