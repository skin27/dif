$kind: http-request
name: Healthcheck Instance
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/reports/instance"
method: GET
headers:
  Authorization: "{{HC_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Content-Type is json", () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.eql('application/json');
      });

      pm.test("assimbly-production", function () {
          pm.expect(pm.response.text()).to.include('assimbly-production');
      });
    language: text/javascript
order: 55000
