            <brand>
              <name>Giant</name>
              <country>Taiwan</country>
              <founded>1972</founded>
              <website>www.giant-bicycles.com</website>
            </brand>
            <brand>
              <name>Cannondale</name>
              <country>United States</country>
              <founded>1971</founded>
              <website>www.cannondale.com</website>
            </brand>
            <brand>
              <name>Specialized</name>
              <country>United States</country>
              <founded>1974</founded>
