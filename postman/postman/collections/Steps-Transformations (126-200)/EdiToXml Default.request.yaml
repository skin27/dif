    code: |-
      const expected = `<edi-message><delimiters segment="LB" field="~" component="^" sub-component="!" /><CUS><field.1><component.1>John</component.1><component.2>Doe</component.2></field.1><field.2>1901-01-07</field.2><field.3>john.doe@example.com</field.3></CUS><CUS><field.1><component.1>John</component.1><component.2>Doe</component.2></field.1><field.2>1902-01-07</field.2><field.3>john.doe@example.com</field.3></CUS><CUS><field.1><component.1>John</component.1><component.2>Doe</component.2></field.1><field.2>1903-01-07</field.2><field.3>john.doe@example.com</field.3></CUS><CUS><field.1><component.1>John</component.1><component.2>Doe</component.2></field.1><field.2>1904-01-07</field.2><field.3>john.doe@example.com</field.3></CUS></edi-message>`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
      //    console.log('actual');
      //    console.log(actual.replace(/[\r\n\t]/g, ""));
      //    console.log('expected');
      //    console.log(expected.replace(/[\r\n\t]/g, ""));
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
