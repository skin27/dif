$kind: http-request
name: XmlToJson TFTTTF 30
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=TFTTTF"
method: POST
queryParams:
  config: TFTTTF
body:
  type: xml
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <e>
      <street class="array">Windsor street</street>
    </e>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`[
        [
          "Windsor street"
        ]
      ]`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 225000
