$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Base64Encod\
  eText"
method: POST
body:
  type: text
  content: This is a plain text body.
scripts:
  - type: afterResponse
    code: |-
      const expected = `VGhpcyBpcyBhIHBsYWluIHRleHQgYm9keS4=`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t]/g, "")).to.eql(expected.replace(/[\r\n\t]/g, ""));   
      });
    language: text/javascript
order: 2000
