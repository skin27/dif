scripts:
  - type: afterResponse
    code: |-
      const expected = `{"customer":{"addresses":[{"city":"BARENDRECHT","country_id":"NL","firstname":"J.A. Meeder B.V.","postcode":"2991 LE","street":["Donk 15"],"vat_id":"AABMVL","default_shipping":true,"custom_attributes":[{"attribute_code":"type","value":"shipping"}]},{"city":"BARENDRECHT","country_id":"NL","firstname":"J.A. Meeder B.V.","postcode":"2991 LE","street":["Donk 15"],"vat_id":"AABMVM","custom_attributes":[{"attribute_code":"type","value":"shipping"}]},{"city":"BARENDRECHT","country_id":"NL","firstname":"J.A. Meeder B.V.","postcode":"2991 LE","street":["Donk 15"],"vat_id":"AABMVN","default_billing":true,"custom_attributes":[{"attribute_code":"type","value":"billing"}]}],"email":"claire@meeder.nl","firstname":"J.A. Meeder B.V.","id":2600,"websiteId":1,"group_id":2354,"store_id":1,"custom_attributes":[{"attribute_code":"disable_account","value":"0"}]}}`;

      const actual = pm.response.json();

      function sortJSON(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              return obj.map(sortJSON);
          }

          if (obj instanceof Object) {
              const sortedObject = {};
              Object.keys(obj).sort().forEach(key => {
                  sortedObject[key] = sortJSON(obj[key]);
              });
              return sortedObject;
          }

          return obj;
      }

      const sortedExpected = sortJSON(JSON.parse(expected));
      const sortedActual = sortJSON(actual);

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(sortedActual).to.eql(sortedExpected);
      });
