$kind: http-request
url: https://{{server}}.dovetail.world/{{environment}}/inbound_http/wcgintegrationdev/Inbound_CDF_POORDER
method: POST
headers:
  integrationLogLevel: "([[message: 'POST_PurchaseOrderLines', nodes:['lineNumber','productCode']]])"
body:
  type: xml
  content: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

    <!-- \r

    CDF_PORECEIPT_000001: Dit is een eenvoudige CDF om een inkooporder aan te maken.\r

    \r

    Regel #1 : CDF000100, 10 STK\r

    Regel #2 : CDF000200, 20 STK\r

    \r

    Eindresultaat:\r

    \r

    Wholesale: Inkooporder met 2 regels op leverancier 2001\r

    CDF000100 - 10 STK\r

    CDF000200 - 20 STK\r

    \r

    Aantal regels aangeleverd: 2\r

    Aantal regels verwerkt : 2\r

    Aantal regels met fouten: 0\r

    Totaal aantal meldingen: 0\r

    \r

    MELDINGEN\r

    Geen\r

    \r

    -->\r

    <Enriched>\r

    \t<PO_ORDER>\r

    \t\t<issueDate>{{currentdate}}</issueDate>\r

    \t\t<issueTime>235959</issueTime>\r

    \t\t<documentId>CDF_POORDER_000002</documentId>\r

    \t\t<documentSource>PostMan</documentSource>\r

    \t\t<sender>\r

    \t\t\t<senderId>2001</senderId>\r

    \t\t\t<senderName>Meubelfabriek &amp; Co</senderName>\r

    \t\t</sender>\r

    \t\t<header>\r

    \t\t\t<orderReference>CDF_PORECEIPT_prep001</orderReference>\r

    \t\t\t<orderType>NOR</orderType>\r

    \t\t\t<backofficeId>01</backofficeId>\r

    \t\t\t<currency>EUR</currency>\r

    \t\t</header>\r

    \t\t<lines>\r

    \t\t\t<line>\r

    \t\t\t\t<unitId>STK</unitId>\r

    \t\t\t\t<quantity type=\"number\">10</quantity>\r

    \                <deliveryDateEarliest>2023-04-04</deliveryDateEarliest>\r

    \                <deliveryDateLatest>2023-04-06</deliveryDateLatest>\r

    \t\t\t\t<price type=\"number\">1.11</price>\r

    \t\t\t\t<productIdentifier>\r

    \t\t\t\t\t<productId>CDF000100</productId>\r

    \t\t\t\t</productIdentifier>\r

    \t\t\t</line>\r

    \t\t\t<line>\r

    \t\t\t\t<unitId>STK</unitId>\r

    \t\t\t\t<quantity type=\"number\">20</quantity>\r

    \                <deliveryDateEarliest>2023-04-03</deliveryDateEarliest>\r

    \                <deliveryDateLatest>2023-04-10</deliveryDateLatest>\t\t\t\t\r

    \t\t\t\t<price type=\"number\">2.22</price>\r

    \t\t\t\t<productIdentifier>\r

    \t\t\t\t\t<productId>CDF000200</productId>\r

    \t\t\t\t</productIdentifier>\r

    \t\t\t</line>\r

    \t\t</lines>\r

    \t</PO_ORDER>\r

    </Enriched>\r\n"
auth:
  type: apikey
  credentials:
    key: Authorization
    value: "{{Authorization_CDF_POORDER}}"
scripts:
  - type: beforeRequest
    code: "//Zetten variabelen benodigd voor test\r

      var moment = require('moment');\r

      pm.globals.set('currentdate', moment().format((\"YYYY-MM-DD\")));\r

      \r

      //Hieronder verwachtte inhoud wrapUp headers en meldingen vastleggen.\r

      \r

      //Te controleren headers vanuit WHLSL20\r

      pm.globals.set(\"wrapUp_ErrorCount\",'0')\r

      pm.globals.set(\"wrapUp_LinesError\",'0')\r

      pm.globals.set(\"wrapUp_LinesOutput\",'2')\r

      pm.globals.set(\"wrapUp_LinesProcessed\",'2') \r

      \r

      //Te controleren meldingen vanuit WHLSL20\r

      const arrayMessageIds = []\r

      const arrayErrorMessages = []\r

      \r

      //------------------------------------------------------------------------------------------------------------------------------------------------\r

      //Script hieronder niet wijzigen\r

      //Naam van testScenario\r

      pm.globals.set(\"testScenario\", request.name)\r

      \r

      //Zet te controleren meldingen op globale variabelen.\r

      pm.globals.set(\"testMessageIds\", arrayMessageIds)\r

      pm.globals.set(\"testErrorMessages\", arrayErrorMessages)\r\n"
    language: text/javascript
  - type: afterResponse
    code: "//Doorgeven van informatie vanuit dit request naar een volgend request\r

      //Alleen nodig indien er afhankelijkheden tussen requests bestaan.\r

      pm.globals.set(\"orderCode\",pm.response.headers.get('orderCode'))\r

      \r

      \r

      //Zetten van request object om deze POORDER request ook voor andere testen te kunnen gebruiken (zoals POORDRSP en PORECEIPT)\r

      //pm.request.headers.upsert({key: \"removeResult\",value: false})\r

      //pm.environment.set('create_POORDER_000002',pm.request)\r

      //Note 230703: bovenstaande \"uitgeREMd\" omdat dit alleen noodzakelijk was bij chainen van request over collecties heen\r

      //Echter werkte dit dan niet bij scheduled runs, daarom CDF_POORDRSP_000001_prep eerst draaien (copy van CDF_POORDER_000002)"
    language: text/javascript
order: 8000
