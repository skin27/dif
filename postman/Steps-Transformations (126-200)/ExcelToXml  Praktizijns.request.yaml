                  <samenvatting>Mediation in verzekeringsgerelateerde zaken is in de Verenigde Staten na ruim veertig jaar mainstream. Honderden grote verzekeringszaken per jaar worden via mediation opgelost. Bij ons in Nederland is het nog niet zover, maar het lijkt inmiddels wel uit de kinderschoenen. Er is een aantal voorbeelden van zaken waar met mediation in relatief korte tijd grote schikkingen werden bereikt en jaren procederen is voorkomen. Ook zijn er de laatste jaren meer complexe zaken zoals de massaschadeclaims in het kader van de Wet Afwikkeling Massaschade in Collectieve Actie (WAMCA) die zich wellicht goed voor mediation lenen. Vaak zijn de resultaten van een mediationproces goed, maar het gaat ook wel eens mis. Hoe bepaal je als partij nu vooraf of in een individueel geschil een mediationaanpak een goede kans van slagen heeft of niet?&lt;BR/&gt;&lt;BR/&gt;                                                                                                                                                                                        </samenvatting>
