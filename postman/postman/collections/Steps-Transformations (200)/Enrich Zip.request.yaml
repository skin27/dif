$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Enrich_zip"
method: POST
headers:
  bodyType: zip
body:
  type: xml
  content: |
    <?xml version="1.0" encoding="UTF-8"?>
    <bicycle_brands>
        <brand>
            <name>Batavus</name>
            <country>The Netherlands</country>
            <founded>1888</founded>
            <website>www.batavus.nl</website>
        </brand>
    </bicycle_brands>
scripts:
  - type: afterResponse
    code: |-
      pm.test("body contains enrich1.txt", function () {
          pm.expect(pm.response.text()).to.include('enrich1.txt');
      });
      pm.test("body contains enrich2.txt", function () {
          pm.expect(pm.response.text()).to.include('enrich2.txt');
      });
      pm.test("body contains enrich3.txt", function () {
          pm.expect(pm.response.text()).to.include('enrich3.txt');
      });
      pm.test("bodyType is zip", () => {
        pm.expect(pm.response.headers.get('bodyType')).to.eql('zip');
      });
      pm.test("Position is After 2nd archive", () => {
        pm.expect(pm.response.headers.get('Position')).to.eql('After 2nd archive');
      });
    language: text/javascript
order: 31000
