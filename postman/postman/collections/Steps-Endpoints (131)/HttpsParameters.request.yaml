$kind: http-request
name: HttpsParameters
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/HttpsParameters"
method: POST
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      var instance = pm.collectionVariables.get("INSTANCE");

      var output = "";

      switch (instance) {
          case "acceptance":
              output = 'a';
              break;
          case "development":
              output = '{age=30, name=Alice}';
              break;
          case "next":
              output = '{"age":30,"name":"Alice"}';
              break;
          default:
              pm.test("Invalid environment specified");
              break;
      }
    language: text/javascript
order: 40000
