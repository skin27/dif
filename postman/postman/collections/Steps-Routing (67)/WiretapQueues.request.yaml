$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/WiretapQueues"
method: POST
headers:
  BaseUrl: "{{BASE_URL}}"
body:
  type: text
  content: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}"
scripts:
  - type: afterResponse
    code: |-
      const expected = `https://environment.fluxygen.com/test/inbound_http/regressiontests`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          console.log('actual');
          console.log(actual.replace(/[\r\n\t]/g, ""));
          console.log('expected');
          console.log(expected.replace(/[\r\n\t]/g, ""));
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
    language: text/javascript
order: 60000
