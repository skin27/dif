                  <samenvatting>Deze bijdrage betreft de vraag of oplegging door de civiele rechter van de sanctie punitive damages moet worden aangemerkt als criminal charge in de zin van artikel 6 EVRM. In dat geval zijn niet alleen de algemene waarborgen van lid 1, maar ook de strafrechtelijke waarborgen van lid 2 en 3 van toepassing. Dit heeft gevolgen voor het civiele proces en voor de toekomst van punitive damages in continentaal Europa. Ter beantwoording van deze vraag zal relevante rechtspraak van het EHRM aan bod komen, alsmede de wijze waarop het recht op een eerlijk proces in het Amerikaanse punitive damages recht wordt ingevuld.                                                                                                                                                                                                                                                                                                                                                                                                                        </samenvatting>
