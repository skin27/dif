$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Base64Decod\
  eText"
method: POST
body:
  type: text
  content: VGhpcyBpcyBhIHBsYWluIHRleHQgYm9keS4=
scripts:
  - type: afterResponse
    code: |-
      const expected = `This is a plain text body.`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
    language: text/javascript
order: 4000
