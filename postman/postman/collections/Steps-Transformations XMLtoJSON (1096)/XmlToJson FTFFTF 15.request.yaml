$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=FTFFTF"
method: POST
queryParams:
  config: FTFFTF
body:
  type: xml
  content: |-
    <Orders xmlns="http://DataAccess.com/webservices/" xmlns:m="http://DataAccess.com/webservicesOrders/" xmlns:x="http://DataAccess.com/webservicesCustomer/">
        <x:Order>
            <OrderNo>1</OrderNo>
            <m:Customer>
                <m:CustomerNo>99</m:CustomerNo>
                <x:State>CA</x:State>
                <m:State>Angry</m:State>
                <State>Yes</State>
            </m:Customer>
        </x:Order>
    </Orders>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "@xmlns": "http://DataAccess.com/webservices/",
          "@xmlns:m": "http://DataAccess.com/webservicesOrders/",
          "@xmlns:x": "http://DataAccess.com/webservicesCustomer/",
          "Order": {
              "OrderNo": null,
              "Customer": {
                  "@xmlns:m": "http://DataAccess.com/webservicesOrders/",
                  "CustomerNo": null,
                  "State": [
                      null,
                      null,
                      null
                  ]
              }
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 970000
