                  <samenvatting>Dit Asser-deel verschaft inzicht in de verschillende kernthema's rondom bewijsvoering in het civiele proces. De praktijkgeoriënteerde lezer krijgt inzicht in verschillende aspecten van het civiele bewijs, waaronder de vertrouwelijkheid van de informatie, de betrouwbaarheid van informatiebronnen en de preprocessuele verzameling van informatie.&lt;BR/&gt;&lt;BR/&gt;Feitelijke informatie staat aan de basis van elke rechterlijke uitspraak. Asser-deel Procesrecht 3 Bewijs behandelt de gehele range aan thema?s rondom de vergaring, beoordeling en toepassing van informatie in de rechtspraak. De uitgave kenmerkt zich door een thematische opzet, die de verbanden tussen alle aspecten van het burgerlijk bewijs voor de lezer inzichtelijk maakt.&lt;BR/&gt;&lt;BR/&gt;De auteur neemt de waarheidsvinding in het civiele proces als uitgangspunt. Een gezond proces vereist immers voldoende informatie om de partijen in staat te stellen tot een behoorlijk debat en de rechter tot een feitelijk solide uitspraak. Deze uitgave verheldert de actuele regels vanhet civiele bewijsrecht en de manier waarop zij in de rechtspraktijk worden toegepast.&lt;BR/&gt;&lt;BR/&gt;Thema's civiele proces&lt;BR/&gt;Asser-deel Procesrecht 3 Bewijs belicht enerzijds de fundamentele uitgangspunten van het bewijsrecht, zoals de rol van het feit in de rechtstoepassing, de waarheidsvinding en de grenzen daaraan. Daarnaast komen uiteenlopende thema's aan bod met betrekking tot de informatie die in het civiele proces wordt gegeven, gevraagd, verkregen en soms afgedwongen. Dit zijn onder meer de vertrouwelijkheid van de informatie, betrouwbaarheid van de informatiebronnen en preprocessuele verzameling van informatie.&lt;BR/&gt;&lt;BR/&gt;Bewijsrecht actueel&lt;BR/&gt;De actuele ontwikkelingen in het civiele bewijsrecht vragen om de nodige verdieping, met name het wetsvoorstel Vereenvoudiging en modernisering burgerlijk bewijsrecht. Deze uitgave belicht de verschillende aspecten van de in het wetsvoorstel voorgestelde vernieuwingen van het bewijsrecht.&lt;BR/&gt;&lt;BR/&gt;Bewijsmiddelen&lt;BR/&gt;De auteur staat niet alleen stil bij de        algemene voorschriften van bewijsrecht, maar tevens bij de concrete bewijsmiddelen, zoals geschriften, getuigen en deskundigen. Deze elementen komen terugkerend per thema aan bod. De uitgave sluit af met een beschouwing op de bewijslastverdeling, die ook in de werkelijkheid van het proces het sluitstuk vormt.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </samenvatting>
