$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJsonSi\
  mple?config=TTTF"
method: POST
queryParams:
  config: TTTF
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
        <products class="array">
            <product class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </product>
            <product class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </product>
        </products>
        <images class="array">
            <image class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </image>
            <image class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </image>
        </images>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "images": {
              "image": [
                  {
                      "@class": "object",
                      "name": {
                          "@type": "string",
                          "jsonContent": "spoon"
                      },
                      "id": {
                          "@type": "string",
                          "jsonContent": "1"
                      }
                  },
                  {
                      "@class": "object",
                      "name": {
                          "@type": "string",
                          "jsonContent": "knife"
                      },
                      "id": {
                          "@type": "string",
                          "jsonContent": "2"
                      }
                  }
              ],
              "@class": "array"
          },
          "products": {
              "product": [
                  {
                      "@class": "object",
                      "name": {
                          "@type": "string",
                          "jsonContent": "spoon"
                      },
                      "id": {
                          "@type": "string",
                          "jsonContent": "1"
                      }
                  },
                  {
                      "@class": "object",
                      "name": {
                          "@type": "string",
                          "jsonContent": "knife"
                      },
                      "id": {
                          "@type": "string",
                          "jsonContent": "2"
                      }
                  }
              ],
              "@class": "array"
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
