scripts:
  - type: afterResponse
    code: |-
      // Import the xml2js library
      const xml2js = require('xml2js');

      const expected = `<?xml version="1.0" encoding="UTF-8"?>
      <retailers odata.context="https://prd-api.loud.nl/ZMUh9pocyR99bPaL/v1/sml.svc/$metadata#ACM_CONTACTS_CLANG">
          <value>
              <element>
                  <Address>In den Hörn</Address>
                  <City>Bad</City>
                  <E_MailL>deduvlag@web.dk</E_MailL>
                  <EmlGrpCode>MKT-mailing</EmlGrpCode>
                  <Huisnummer_factuur>121</Huisnummer_factuur>
                  <ID>4136</ID>
                  <Klantnaam>De Duhlag</Klantnaam>
                  <Klantnaam_1>De Duhlag</Klantnaam_1>
                  <Klantnaam_2>De Duhlag</Klantnaam_2>
                  <Klantnummer>D1039</Klantnummer>
                  <Land>Germany</Land>
                  <Land_factuur>Germany</Land_factuur>
                  <Land_factuur_1>Germany</Land_factuur_1>
                  <Language>German</Language>
                  <Naam>Diana Whitaker</Naam>
                  <ZipCode>18209</ZipCode>
                  <id__>5921</id__>
              </element>
              <element>
                  <Address>Allee</Address>
                  <City>Kleve</City>
                  <E_MailL>jhoff@loff.be</E_MailL>
                  <EmlGrpCode>MKT-mailing</EmlGrpCode>
                  <Huisnummer_factuur>351</Huisnummer_factuur>
                  <ID>1348</ID>
                  <Klantnaam>fohnsa</Klantnaam>
                  <Klantnaam_1>Im- und Export GmbH</Klantnaam_1>
                  <Klantnaam_2> Im- und Export GmbH</Klantnaam_2>
                  <Klantnummer>D105040</Klantnummer>
                  <Land>Germany</Land>
                  <Land_factuur>Germany</Land_factuur>
                  <Land_factuur_1>Germany</Land_factuur_1>
                  <Language>German</Language>
                  <Naam>Johan Cruijff</Naam>
                  <ZipCode>251</ZipCode>
                  <id__>1902</id__>
              </element>
          </value>
      </retailers>`;

      const actual = pm.response.text();

      // Function to sort the elements in a JavaScript object
      function sortObject(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              return obj.map(sortObject);
          }

          return Object.keys(obj).sort().reduce((acc, key) => {
              acc[key] = sortObject(obj[key]);
              return acc;
          }, {});
      }

      // Parse XML strings into JavaScript objects
      xml2js.parseString(expected, (err, result1) => {
          if (err) {
              pm.test('XML parsing error for expected xml', () => {
                  pm.expect(err).to.be.null;
              });
          } else {
              xml2js.parseString(actual, (err, result2) => {
                  if (err) {
                      pm.test('XML parsing error for actual xml', () => {
                          pm.expect(err).to.be.null;
                      });
                  } else {
                      // Sort the objects
                      const sortedObject1 = sortObject(result1);
                      const sortedObject2 = sortObject(result2);

                      // Compare the sorted objects
                      pm.test('XML strings are equivalent, ignoring element order', () => {
                          pm.expect(sortedObject1).to.eql(sortedObject2);
                      });
                  }
              });
          }
      });
    language: text/javascript
order: 64000
