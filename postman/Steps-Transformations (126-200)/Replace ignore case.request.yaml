$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Replace_ignore_case"
method: POST
body:
  type: json
  content: |-
    Lovetail
    lovetaiL
    LlLlLlL
scripts:
  - type: afterResponse
    code: |-
      const expected = `DovetaiD
      DovetaiD
      DDDDDDD`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
      //    console.log('actual');
      //    console.log(actual.replace(/[\r\n\t]/g, ""));
      //    console.log('expected');
      //    console.log(expected.replace(/[\r\n\t]/g, ""));
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
    language: text/javascript
order: 80000
