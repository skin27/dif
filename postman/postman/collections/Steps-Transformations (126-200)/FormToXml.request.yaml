$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/FormToXml"
method: POST
body:
  type: urlencoded
  content:
    data-set: " empty-set / pairs"
    pairs: " pair *(seperator pair)"
    pair: ' name [ "=" value ]'
    name: " *(namechar / escape / percent / plus)"
    value: " *(valuechar / escape / percent / plus)"
    namechar: ' <any octet except ";", "&", "+", "%", "=">'
    valuechar: ' <any octet except ";", "&", "+", "%">'
    escape: ' "%" 2hexdig'
    separator: ' ";" / "&"'
    percent: ' "%"'
    plus: ' "+"'
    empty-set: ' ""'
scripts:
  - type: afterResponse
    code: |-
      // const expected = `<?xml version="1.0" encoding="utf-8"?>
      // <items>
      //   <valuechar> &lt;any octet except &quot;;&quot;, &quot;</valuechar>
      //   <empty-set> &quot;&quot;</empty-set>
