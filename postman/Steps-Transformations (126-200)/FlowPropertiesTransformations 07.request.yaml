$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/FlowPropertiesTransformations_07"
method: POST
body:
  type: json
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <breakfast_menu>
        <food>
            <name>food1</name>
            <price>1</price>
            <description>desc1</description>
        </food>
        <food>
            <name>food2</name>
            <price>2</price>
            <description>desc2</description>
        </food>
        <food>
            <name>food3</name>
            <price>3</price>
            <description>desc3</description>
        </food>
    </breakfast_menu>
scripts:
  - type: afterResponse
    code: |-
      let responseSize=pm.response.size();
      pm.test("Verify response sizes",()=>{
          pm.expect(Number(responseSize.total)).to.below(5100);
          pm.expect(Number(responseSize.body)).to.above(3400);
          pm.expect(Number(responseSize.body)).to.below(5100);
      //    pm.expect(Number(responseSize.header)).to.be.below(500);
          }
      );
    language: text/javascript
order: 40000
