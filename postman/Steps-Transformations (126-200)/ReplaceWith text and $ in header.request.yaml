$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/ReplaceWith_text_and_S_in_header"
method: POST
body:
  type: xml
  content: |-
    <documents>
        <eriktest>testing123</eriktest>
    </documents>
scripts:
  - type: afterResponse
    code: |-
      const expected = `<documents>
          <eriktest>testing123</eriktest>
          <ErikTestComment>$-character</ErikTestComment>
      </documents>`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
      //    console.log('actual');
      //    console.log(actual.replace(/[\r\n\t]/g, ""));
      //    console.log('expected');
      //    console.log(expected.replace(/[\r\n\t]/g, ""));
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
    language: text/javascript
order: 90000
