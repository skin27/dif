$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJsonSi\
  mple?config=FTFT3"
method: POST
queryParams:
  config: FTFT3
body:
  type: xml
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <Formula1>
        <Drivers class="array">
            <Driver class="object">
                <Name type="string">Max Verstappen</Name>
                <AvgSpeed type="number">299.9999</AvgSpeed>
            </Driver>
            <Driver class="object">
                <Name type="string">Lando Norris</Name>
                <AvgSpeed type="number">297.00000001</AvgSpeed>
            </Driver>
        </Drivers>
    </Formula1>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "Formula1": {
              "Drivers": {
                  "@class": "array",
                  "Driver": [
                      {
                          "AvgSpeed": 299.9999,
                          "@class": "object",
                          "Name": "Max Verstappen"
                      },
                      {
                          "AvgSpeed": 297.00000001,
                          "@class": "object",
                          "Name": "Lando Norris"
                      }
                  ]
              }
          }
      }
      `);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 1170000
