$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=TFTFTF"
method: POST
queryParams:
  config: TFTFTF
body:
  type: xml
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <rmessage>
        <code>36A</code>
        <dummy>
            <dummyB type="number">123</dummyB>
            <dummyB type="number">456</dummyB>
        </dummy>
    </rmessage>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "code": "36A",
          "dummy": [
              "123",
              "456"
          ]
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 222000
