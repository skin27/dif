$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/SOAP_token"
method: POST
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      // Import the xml2js library
      const xml2js = require('xml2js');

      const expected = `<?xml version="1.0" encoding="UTF-8"?>
      <GetPhoneTypesResponse xmlns="http://retail3000.net/Retail3000Webservice/WebserviceCustomerComponents"
                              xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"
                              xmlns:xsd="http://www.w3.org/2001/XMLSchema"
                              xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <GetPhoneTypesResult>
              <ViewPhoneTypeInfo>
                  <ItemId>1</ItemId>
                  <CreatedByUserId>12</CreatedByUserId>
                  <CreatedDateTime>2016-05-03T09:48:19.893</CreatedDateTime>
                  <LastModifiedByUserId>12</LastModifiedByUserId>
                  <LastModifiedDateTime>2016-05-03T09:48:19.893</LastModifiedDateTime>
                  <CompanyId>13</CompanyId>
                  <OrganizationId>-1</OrganizationId>
                  <Description>Telefoon</Description>
                  <PhoneType>Telephone</PhoneType>
                  <FollowupNumber>-1</FollowupNumber>
                  <PhoneTypeDescription>Telefoon</PhoneTypeDescription>
              </ViewPhoneTypeInfo>
              <ViewPhoneTypeInfo>
                  <ItemId>3</ItemId>
                  <CreatedByUserId>14</CreatedByUserId>
                  <CreatedDateTime>2016-05-04T12:21:13.667</CreatedDateTime>
                  <LastModifiedByUserId>14</LastModifiedByUserId>
                  <LastModifiedDateTime>2016-05-04T12:21:13.667</LastModifiedDateTime>
                  <CompanyId>13</CompanyId>
                  <OrganizationId>-1</OrganizationId>
                  <Description>Fax</Description>
                  <PhoneType>Fax</PhoneType>
                  <FollowupNumber>-1</FollowupNumber>
                  <PhoneTypeDescription>Fax</PhoneTypeDescription>
              </ViewPhoneTypeInfo>
              <ViewPhoneTypeInfo>
                  <ItemId>4</ItemId>
                  <CreatedByUserId>14</CreatedByUserId>
                  <CreatedDateTime>2016-05-04T12:21:21.313</CreatedDateTime>
                  <LastModifiedByUserId>14</LastModifiedByUserId>
                  <LastModifiedDateTime>2016-05-04T12:21:21.313</LastModifiedDateTime>
                  <CompanyId>13</CompanyId>
                  <OrganizationId>-1</OrganizationId>
                  <Description>GSM</Description>
                  <PhoneType>CellPhone</PhoneType>
                  <FollowupNumber>-1</FollowupNumber>
                  <PhoneTypeDescription>GSM</PhoneTypeDescription>
              </ViewPhoneTypeInfo>
          </GetPhoneTypesResult>
      </GetPhoneTypesResponse>`;

      const actual = pm.response.text();

      // Function to sort the elements in a JavaScript object
      function sortObject(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              return obj.map(sortObject);
          }

          return Object.keys(obj).sort().reduce((acc, key) => {
              acc[key] = sortObject(obj[key]);
              return acc;
          }, {});
      }

      // Parse XML strings into JavaScript objects
      xml2js.parseString(expected, (err, result1) => {
          if (err) {
              pm.test('XML parsing error for expected xml', () => {
                  pm.expect(err).to.be.null;
              });
          } else {
              xml2js.parseString(actual, (err, result2) => {
                  if (err) {
                      pm.test('XML parsing error for actual xml', () => {
                          pm.expect(err).to.be.null;
                      });
                  } else {
                      // Sort the objects
                      const sortedObject1 = sortObject(result1);
                      const sortedObject2 = sortObject(result2);

                      // Compare the sorted objects
                      pm.test('XML strings are equivalent, ignoring element order', () => {
                          pm.expect(sortedObject1).to.eql(sortedObject2);
                      });
                  }
              });
          }
      });
    language: text/javascript
order: 82000
