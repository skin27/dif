$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=TFFTFT"
method: POST
queryParams:
  config: TFFTFT
body:
  type: xml
  content: '<?xml version="1.0" encoding="UTF-8"?><root><Persons
    class="array"><element><UserDefinedFieldsJson class="string">{"udf1":
    "16147","udf2": "16147"}</UserDefinedFieldsJson></element></Persons></root>'
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "root": {
              "Persons": [
                  {
                      "UserDefinedFieldsJson": {
                          "udf1": "16147",
                          "udf2": "16147"
                      }
                  }
              ]
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
