$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/ReplaceWith\
  _text_and_header"
method: POST
body:
  type: xml
  content: |-
    <Aggregated>
        <eriktest>testing123</eriktest>
    </Aggregated>
scripts:
  - type: afterResponse
    code: |-
      const expected = `<ErikTest_abc>
          <eriktest>testing123</eriktest>
      </ErikTest_abc>`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
      //    console.log('actual');
      //    console.log(actual.replace(/[\r\n\t]/g, ""));
      //    console.log('expected');
      //    console.log(expected.replace(/[\r\n\t]/g, ""));
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
    language: text/javascript
order: 104000
