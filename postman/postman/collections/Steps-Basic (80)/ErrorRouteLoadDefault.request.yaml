$kind: http-request
name: ErrorRouteLoadDefault
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/ErrorRouteLoadDefault"
method: POST
scripts:
  - type: afterResponse
    code: |+
      var instance = pm.environment.name;

      var output = "";

      switch (instance) {
          case "acceptance":
              output = '{"code": 500,"error": "org.xml.sax.SAXParseException; lineNumber: 1; columnNumber: 1; Content is not allowed in prolog.","info": "Something went wrong calling the Dovetail service. Please refer to the Dovetail logs for more information."}';
              break;
          case "demo":
              output = '{"code": 500,  "error": "org.xml.sax.SAXParseException; lineNumber: 1; columnNumber: 1; Content is not allowed in prolog.",  "info": "Something went wrong calling the HTTP service. Please refer to the logs for more information."}';
              break;
          case "development":
              output = '{"code": 500,  "error": "org.xml.sax.SAXParseException; lineNumber: 1; columnNumber: 1; Content is not allowed in prolog.",  "info": "Something went wrong calling the HTTP service. Please refer to the logs for more information."}';
              break;
          case "next":
              output = 'ErrorRouteLoadDefault has been removed';
              break;
          case "development-ecs":
              output = '{"code": 500,  "error": "org.xml.sax.SAXParseException; lineNumber: 1; columnNumber: 1; Content is not allowed in prolog.",  "info": "Something went wrong calling the HTTP service. Please refer to the logs for more information."}';
              break;
          default:
              output = '{"code": 500,"error": "org.xml.sax.SAXParseException; lineNumber: 1; columnNumber: 1; Content is not allowed in prolog.","info": "Something went wrong calling the HTTP service. Please refer to the logs for more information."}';
              break;
      }

      //Check values in the console
      //console.log(instance);
      //console.log(output);

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.expect(actual.replace(/[\s]/g, "")).to.eql(output.replace(/[\s]/g, ""));     
      });


      pm.test("Status code is 500", function () {
          pm.response.to.have.status(500);
          });

      pm.test("Response time is less than 6500ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(6500);
          });

    language: text/javascript
order: 48000
