$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=FTFTTF"
method: POST
queryParams:
  config: FTFTTF
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
        <products>
            <product>
                <id>1</id>
                <number>1</number>
            </product>
            <product>
                <id>2</id>
                <number>2</number>
            </product>
        </products>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`[
          [
              {
                  "id": "1",
                  "number": "1"
              },
              {
                  "id": "2",
                  "number": "2"
              }
          ]
      ]`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 873000
