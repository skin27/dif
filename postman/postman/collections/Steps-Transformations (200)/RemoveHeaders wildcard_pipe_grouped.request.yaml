$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/RemoveHeaders_wildcard_pipe_grouped"
method: POST
body:
  type: file
  content: {}
scripts:
  - type: afterResponse
    code: |-
      pm.test("check_cs header is not present", () => {
        pm.response.to.not.have.header("check_cs");
      });

      pm.test("status_cs header is not present", () => {
        pm.response.to.not.have.header("status_cs");
      });

      pm.test("cs_headers_before", () => {
        pm.expect(pm.response.headers.get('cs_headers_before')).to.eql('123,456');
      });

      pm.test("cs_headers_after", () => {
        pm.expect(pm.response.headers.get('cs_headers_after')).to.eql(',');
      });
    language: text/javascript
order: 72000
