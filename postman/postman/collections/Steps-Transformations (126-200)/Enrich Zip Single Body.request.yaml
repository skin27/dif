$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Enrich_zip_\
  single_body"
method: POST
headers:
  bodyType: zip
body:
  type: xml
  content: |
    <?xml version="1.0" encoding="UTF-8"?>
    <bicycle_brands>
        <brand>
            <name>Batavus</name>
            <country>The Netherlands</country>
            <founded>1888</founded>
            <website>www.batavus.nl</website>
        </brand>
    </bicycle_brands>
scripts:
  - type: afterResponse
    code: |-
      pm.test("body contains", function () {
          pm.expect(pm.response.text()).to.include('enrich2');
          pm.expect(pm.response.text()).to.include('enrich2.txt');
          pm.expect(pm.response.headers.get('Content-Type')).to.eql('application/zip');
          pm.expect(pm.response.headers.get('Content-disposition')).to.eql('attachment; filename="enrich1.txt.zip"');
      });
    language: text/javascript
order: 35000
