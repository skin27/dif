$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/FileOutbound_override_zip"
method: POST
headers:
  Content-Type: application/zip
body:
  type: file
  content:
    src: example_1000lines.xml
scripts:
  - type: afterResponse
    code: |-
      pm.test("FileName is FileOutbound2.zip", () => {
        pm.expect(pm.response.headers.get('FileName')).to.eql('FileOutbound2.zip');
      });

      pm.test("Body matches string 1", function () {
      pm.expect(pm.response.text()).to.include('PK');
      });

      pm.test("Content-Type is application/zip", () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.eql('application/zip');
      });
    language: text/javascript
order: 10000
