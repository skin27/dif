$kind: http-request
name: XmlToJson TFFTTT 03
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=TFFTTT"
method: POST
queryParams:
  config: TFFTTT
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
        <products class="array">
            <product class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </product>
            <product class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </product>
        </products>
        <images class="array">
            <image class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </image>
            <image class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </image>
        </images>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "root": {
              "products": [
                  {
                      "id": "1",
                      "name": "spoon"
                  },
                  {
                      "id": "2",
                      "name": "knife"
                  }
              ],
              "images": [
                  {
                      "id": "1",
                      "name": "spoon"
                  },
                  {
                      "id": "2",
                      "name": "knife"
                  }
              ]
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 696000
