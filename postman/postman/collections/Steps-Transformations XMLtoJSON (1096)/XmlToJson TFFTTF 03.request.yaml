$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?c\
  onfig=TFFTTF"
method: POST
queryParams:
  config: TFFTTF
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
        <products class="array">
            <product class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </product>
            <product class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </product>
        </products>
        <images class="array">
            <image class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </image>
            <image class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </image>
        </images>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "root": {
              "products": {
                  "@class": "array",
                  "product": [
                      {
                          "@class": "object",
                          "id": {
                              "@type": "string",
                              "#text": "1"
                          },
                          "name": {
                              "@type": "string",
                              "#text": "spoon"
                          }
                      },
                      {
                          "@class": "object",
                          "id": {
                              "@type": "string",
                              "#text": "2"
                          },
                          "name": {
                              "@type": "string",
                              "#text": "knife"
                          }
                      }
                  ]
              },
              "images": {
                  "@class": "array",
                  "image": [
                      {
                          "@class": "object",
                          "id": {
                              "@type": "string",
                              "#text": "1"
                          },
                          "name": {
                              "@type": "string",
                              "#text": "spoon"
                          }
                      },
                      {
                          "@class": "object",
                          "id": {
                              "@type": "string",
                              "#text": "2"
                          },
                          "name": {
                              "@type": "string",
                              "#text": "knife"
                          }
                      }
                  ]
              }
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 720000
