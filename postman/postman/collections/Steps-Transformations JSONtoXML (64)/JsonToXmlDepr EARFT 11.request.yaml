$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/JsonToXmlDeprecated?config=EARFT"
method: POST
queryParams:
  config: EARFT
body:
  type: json
  content: |-
    {
        "lb-182_aantal": null
    }
scripts:
  - type: afterResponse
    code: |-
      // Import the xml2js library
      const xml2js = require('xml2js');

      const expected = `<?xml version="1.0" encoding="UTF-8"?>
      <root>
          <lb-182_aantal class="object" null="true"/>
      </root>`;

      const actual = pm.response.text();

      // Function to sort the elements in a JavaScript object
      function sortObject(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              return obj.map(sortObject);
          }

          return Object.keys(obj).sort().reduce((acc, key) => {
              acc[key] = sortObject(obj[key]);
              return acc;
          }, {});
      }

      // Parse XML strings into JavaScript objects
      xml2js.parseString(expected, (err, result1) => {
          if (err) {
              pm.test('XML parsing error for expected xml', () => {
                  pm.expect(err).to.be.null;
              });
          } else {
              xml2js.parseString(actual, (err, result2) => {
                  if (err) {
                      pm.test('XML parsing error for actual xml', () => {
                          pm.expect(err).to.be.null;
                      });
                  } else {
                      // Sort the objects
                      const sortedObject1 = sortObject(result1);
                      const sortedObject2 = sortObject(result2);

                      // Compare the sorted objects
                      pm.test('XML strings are equivalent, ignoring element order', () => {
                          pm.expect(sortedObject1).to.eql(sortedObject2);
                      });
                  }
              });
          }
      });
      var template = `
      <style type="text/css">
          .tftable {font-size:14px;color:#333333;width:100%;border-width: 1px;border-color: #87ceeb;border-collapse: collapse;}
          .tftable th {font-size:18px;background-color:#87ceeb;border-width: 1px;padding: 8px;border-style: solid;border-color: #87ceeb;text-align:left;}
          .tftable tr {background-color:#ffffff;}
          .tftable td {font-size:14px;border-width: 1px;padding: 8px;border-style: solid;border-color: #87ceeb;}
          .tftable tr:hover {background-color:#e0ffff;}
      </style>

      <table class="tftable" border="1">
          <tr>
              <th>ISO Code</th>
              <th>Language</th>
          </tr>
          
          {{#each response.soap:Envelope.soap:Body.m:ListOfLanguagesByNameResponse.m:ListOfLanguagesByNameResult.m:tLanguage}}
              <tr>
                  <td>{{m:sISOCode}}</td>
                  <td>{{m:sName}}</td>
              </tr>
          {{/each}}
      </table>
      `;

      function constructVisualizerPayload() {
          var jsonObject = xml2Json(pm.response.text());
                  
          return { response: jsonObject }
      }

      pm.visualizer.set(template, constructVisualizerPayload());
    language: text/javascript
order: 23000
