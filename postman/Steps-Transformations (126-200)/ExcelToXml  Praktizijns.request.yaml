                  <samenvatting>Het burgerlijk procesrecht gaat in zekere zin om het vinden van het juiste evenwicht tussen procedurele waarborgen aan de ene kant en doelmatigheid aan de andere kant.&lt;BR/&gt;&lt;BR/&gt;Deze rede gaat over rechtsregels die het mogelijk maken eenmaal gewezen rechterlijke uitspraken aan te vechten bij een hogere rechter. De kernboodschap is dat op dit punt het evenwicht zoek is. De bestaande regels over rechtsmiddelen maken ons rechtssysteem te duur, te traag en daardoor voor de meeste burgers en ondernemers onbruikbaar.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             </samenvatting>
