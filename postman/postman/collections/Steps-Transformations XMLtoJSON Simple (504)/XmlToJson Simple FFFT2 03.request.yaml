$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJsonSi\
  mple?config=FFFT2"
method: POST
queryParams:
  config: FFFT2
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <root>
        <products class="array">
            <product class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </product>
            <product class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </product>
        </products>
        <images class="array">
            <image class="object">
                <id type="string">1</id>
                <name type="string">spoon</name>
            </image>
            <image class="object">
                <id type="string">2</id>
                <name type="string">knife</name>
            </image>
        </images>
    </root>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "root": {
              "images": {
                  "image": [
                      {
                          "@class": "object",
                          "name": "spoon",
                          "id": "1"
                      },
                      {
                          "@class": "object",
                          "name": "knife",
                          "id": "2"
                      }
                  ],
                  "@class": "array"
              },
              "products": {
                  "product": [
                      {
                          "@class": "object",
                          "name": "spoon",
                          "id": "1"
                      },
                      {
                          "@class": "object",
                          "name": "knife",
                          "id": "2"
                      }
                  ],
                  "@class": "array"
              }
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 1213000
