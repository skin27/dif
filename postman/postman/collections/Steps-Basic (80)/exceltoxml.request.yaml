$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/CB_ExceltoXml"
method: POST
body:
  type: file
  content:
    src: simplesheet2.xlsx
scripts:
  - type: afterResponse
    code: "const expected = `<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

      <Excel>\r

      \    <Simple>\r

      \        <excelRow>\r

      \            <cell colIndex=\"A\" rowIndex=\"1\">January</cell>\r

      \            <cell colIndex=\"B\" rowIndex=\"1\">12</cell>\r

      \            <cell colIndex=\"C\" rowIndex=\"1\">4530</cell>\r

      \        </excelRow>\r

      \        <excelRow>\r

      \            <cell colIndex=\"A\" rowIndex=\"2\">February</cell>\r

      \            <cell colIndex=\"B\" rowIndex=\"2\">14</cell>\r

      \            <cell colIndex=\"C\" rowIndex=\"2\">6210</cell>\r

      \        </excelRow>\r

      \        <excelRow>\r

      \            <cell colIndex=\"A\" rowIndex=\"3\">March</cell>\r

      \            <cell colIndex=\"B\" rowIndex=\"3\">12</cell>\r

      \            <cell colIndex=\"C\" rowIndex=\"3\">3450</cell>\r

      \        </excelRow>\r

      \    </Simple>\r

      </Excel>`;\r

      \r

      const actual = pm.response.text();\r

      \r

      pm.test(\"happyflow\", function () {\r

      \    pm.response.to.not.be.error;\r

      \    pm.expect(actual.replace(/[\\r\\n\\t\\s]/g, \"\")).to.eql(expected.replace(/[\\r\\n\\t\\s]/g, \"\"));     \r

      });"
    language: text/javascript
order: 13000
