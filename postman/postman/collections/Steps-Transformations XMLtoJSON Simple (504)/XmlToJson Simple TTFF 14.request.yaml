$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJsonSi\
  mple?config=TTFF"
method: POST
queryParams:
  config: TTFF
body:
  type: xml
  content: |-
    <lh:List xmlns:lh="http://liquidhub.com/SimpleList" name="Fruit List">
        <lh:Item>Apple</lh:Item>
        <lh:Item>Banana</lh:Item>
    </lh:List>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "List": {
              "Item": [
                  "Apple",
                  "Banana"
              ],
              "@name": "Fruit List"
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 1116000
