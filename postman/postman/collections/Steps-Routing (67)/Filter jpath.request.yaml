$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Filter_jpath"
method: POST
body:
  type: json
  content: |
    
    { "store": {
        "book": [ 
          { "category": "fiction",
            "author": "Herman Melville",
            "title": "Moby Dick",
            "isbn": "0-553-21311-3",
            "price": 8.99
          }
        ],
        "bicycle": {
          "color": "red",
          "price": 19.95
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "store": {
              "book": [
                  {
                      "category": "fiction",
                      "author": "Herman Melville",
                      "title": "Moby Dick",
                      "isbn": "0-553-21311-3",
                      "price": 8.99
                  }
              ],
              "bicycle": {
                  "color": "red",
                  "price": 19.95
              }
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 26000
