    code: |-
      pm.test("Body matches string 1", function () {
          pm.expect(pm.response.text()).to.include('org.xml.sax.SAXParseException; lineNumber: 1; columnNumber: 1; Content is not allowed in prolog.');
      });
    language: text/javascript
order: 14000
