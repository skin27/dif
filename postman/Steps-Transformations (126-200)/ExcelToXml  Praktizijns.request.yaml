                  <samenvatting>De integriteit van de rechter is, net als die van andere publieke functionarissen, steeds vaker onderwerp van discussie en kritiek. Maar wat houdt integriteit precies in? De integere rechter gaat uit van het idee dat integriteit bestaat uit trouw van de rechterlijk ambtenaar aan de eigen institutionele waarden en normen. Integriteit is dus een overkoepelende norm die voor de rechter voorschrijft dat hij zich consequent onpartijdig, onafhankelijk, autonoom en professioneel gedraagt.&lt;BR/&gt;&lt;BR/&gt;De integere rechter biedt zowel een theoretische bespreking van rechterlijke beroepsethiek als een meer praktische reflectie op de concrete dilemma?s waarmee de rechter in zijn werk en privéleven geconfronteerd kan worden. Het biedt verder een bespreking van de rechterlijke onpartijdigheid en onafhankelijkheid in de context van de democratische rechtsstaat en van autonomie en professionaliteit in de context van de moderne rechterlijke organisatie.                                                                             </samenvatting>
