$kind: http-request
name: Healthcheck Flows
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/reports/flows/{{ENVIRONMENT}}"
method: GET
headers:
  Authorization: "{{HC_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 and Content-Type is application/json", function () {
          pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Content-Type')).to.eql('application/json');
      });
    language: text/javascript
order: 54000
