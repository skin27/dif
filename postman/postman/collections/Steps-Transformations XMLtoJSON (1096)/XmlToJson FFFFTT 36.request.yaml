$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?config=FFFFTT"
method: POST
queryParams:
  config: FFFFTT
body:
  type: xml
  content: |-
    <JSONtoXML>
        <noteTypeCode type="string">N</noteTypeCode>
        <productIdentifier class="object">
            <productCode type="string">AH MOEDER</productCode>
        </productIdentifier>
        <text type="string"><![CDATA[Regel LNG #1
    Regel LNG #2
    Regel LNG #3
    Regel LNG #4]]></text>
    </JSONtoXML>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "noteTypeCode": "N",
          "productIdentifier": {
              "productCode": "AH MOEDER"
          },
          "text": "Regel LNG #1\\nRegel LNG #2\\nRegel LNG #3\\nRegel LNG #4"
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 322343
