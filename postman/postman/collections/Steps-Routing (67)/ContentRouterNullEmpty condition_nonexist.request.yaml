$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/ContentRouterNullEmpty"
method: POST
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      const expected = `Header non existent: `;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t]/g, "")).to.eql(expected.replace(/[\r\n\t]/g, ""));    
      });
    language: text/javascript
order: 21000
