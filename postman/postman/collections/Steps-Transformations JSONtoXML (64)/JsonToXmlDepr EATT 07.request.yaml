$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/JsonToXmlDeprecated?config=EATT"
method: POST
queryParams:
  config: EATT
body:
  type: text
  content: |-
    {
        "Orders": {
            "@xmlns": "http://DataAccess.com/webservices/",
            "@xmlns:m": "http://DataAccess.com/webservicesOrders/",
            "@xmlns:x": "http://DataAccess.com/webservicesCustomer/",
            "x:Order": {
                "OrderNo": {
                    "@xmlns": "http://DataAccess.com/webservices/",
                    "#text": "1"
                },
                "m:Customer": {
                    "@xmlns:m": "http://DataAccess.com/webservicesOrders/",
                    "m:CustomerNo": "99",
                    "x:State": {
                        "@xmlns:x": "http://DataAccess.com/webservicesCustomer/",
                        "#text": "CA"
                    },
                    "m:State": "Angry",
                    "State": {
                        "@xmlns": "http://DataAccess.com/webservices/",
                        "#text": "Yes"
                    }
                }
            }
        }
    }
scripts:
  - type: afterResponse
    code: |-
      // Import the xml2js library
      const xml2js = require('xml2js');

      const expected = `<?xml version="1.0" encoding="UTF-8"?>
      <o>
          <Orders class="object" xmlns="http://DataAccess.com/webservices/" xmlns:m="http://DataAccess.com/webservicesOrders/" xmlns:x="http://DataAccess.com/webservicesCustomer/">
              <x:Order class="object" >
                  <OrderNo class="object">1</OrderNo>
                  <m:Customer class="object" >
                      <State class="object">Yes</State>
                      <m:CustomerNo type="string" >99</m:CustomerNo>
                      <m:State type="string" >Angry</m:State>
                      <x:State class="object" >CA</x:State>
                  </m:Customer>
              </x:Order>
          </Orders>
      </o>`;

      const actual = pm.response.text();

      // Function to sort the elements in a JavaScript object
      function sortObject(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              return obj.map(sortObject);
          }

          return Object.keys(obj).sort().reduce((acc, key) => {
              acc[key] = sortObject(obj[key]);
              return acc;
          }, {});
      }

      // Parse XML strings into JavaScript objects
      xml2js.parseString(expected, (err, result1) => {
          if (err) {
              pm.test('XML parsing error for expected xml', () => {
                  pm.expect(err).to.be.null;
              });
          } else {
              xml2js.parseString(actual, (err, result2) => {
                  if (err) {
                      pm.test('XML parsing error for actual xml', () => {
                          pm.expect(err).to.be.null;
                      });
                  } else {
                      // Sort the objects
                      const sortedObject1 = sortObject(result1);
                      const sortedObject2 = sortObject(result2);

                      // Compare the sorted objects
                      pm.test('XML strings are equivalent, ignoring element order', () => {
                          pm.expect(sortedObject1).to.eql(sortedObject2);
                      });
                  }
              });
          }
      });
    language: text/javascript
order: 55000
