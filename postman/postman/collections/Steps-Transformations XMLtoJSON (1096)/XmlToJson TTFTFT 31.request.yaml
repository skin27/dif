$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJson?config=TTFTFT"
method: POST
queryParams:
  config: TTFTFT
body:
  type: xml
  content: |-
    <e>
    	<CustomerPartRef>Seagate ST4000VX016</CustomerPartRef>
    	<LineNo ErpMaterialIssueNotePickListId="9597643" type="number">1</LineNo>
    	<ProductCode>20090129</ProductCode>
    </e>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
        "e" : {
          "CustomerPartRef" : "Seagate ST4000VX016",
          "LineNo" : null,
          "ProductCode" : "20090129"
        }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 49000
