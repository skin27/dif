$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/AggregatedSplitXmlMulti"
method: POST
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: |-
      const expected = `<?xml version="1.0" encoding="UTF-8"?><Aggregated><status>ok</status><status>ok</status></Aggregated>`;

      const actual = pm.response.text();

      pm.test("expected body", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));     
      });
    language: text/javascript
order: 12000
