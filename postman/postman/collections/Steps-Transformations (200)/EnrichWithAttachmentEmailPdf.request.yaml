$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/EnrichWithAttachmentEmailPdf"
method: POST
body:
  type: file
  content:
    src: Fluxygen.pdf
scripts:
  - type: afterResponse
    code: |-
      pm.test("body contains Content-Type: application/pdf", function () {
          pm.expect(pm.response.text()).to.include('Content-Type: application/pdf');
      });
      pm.test("body contains Content-Disposition: attachment; filename=attachment.pdf", function () {
          pm.expect(pm.response.text()).to.include('Content-Disposition: attachment; filename=attachment.pdf');
      });
      pm.test("To", () => {
        pm.expect(pm.response.headers.get('To')).to.eql('norman@fluxygen.com');
      });
    language: text/javascript
order: 26000
