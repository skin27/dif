$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Replace_cr"
method: POST
body:
  type: file
  content:
    src: ExampleCRbup.txt
scripts:
  - type: afterResponse
    code: |
      var instance = pm.collectionVariables.get("INSTANCE");

      var output = "";

      switch (instance) {
          case "acceptance":
              pm.test("Body matches string 1", function () {
          pm.expect(pm.response.text()).to.include('Example1CRExample2CRExample3CR￿');
      });
              break;
          case "development":
              pm.test("Body matches string 1", function () {
          pm.expect(pm.response.text()).to.include('Example1CRExample2CRExample3CR￿');
      });
              break;
                  case "next":
              pm.test("Body matches string 1", function () {
          pm.expect(pm.response.text()).to.include('Example1CRExample2CRExample3CR');
      });
              break;
          default:
              pm.test("Invalid environment specified");
              break;
      }
    language: text/javascript
order: 74000
