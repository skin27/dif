$kind: http-request
name: https
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/CB_https"
method: POST
headers:
  hello: "1"
  goodbey: "2"
scripts:
  - type: afterResponse
    code: "// Import the xml2js library\r

      const xml2js = require('xml2js');\r

      \r

      const expected = `<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r

      <note>\r

      \    <to>Tove</to>\r

      \    <from>Jani</from>\r

      \    <heading>Reminder</heading>\r

      \    <body>Don't forget me this weekend!</body>\r

      </note>`;\r

      \r

      const actual = pm.response.text();\r

      \r

      // Function to sort the elements in a JavaScript object\r

      function sortObject(obj) {\r

      \    if (typeof obj !== 'object' || obj === null) {\r

      \        return obj;\r

      \    }\r

      \r

      \    if (Array.isArray(obj)) {\r

      \        return obj.map(sortObject);\r

      \    }\r

      \r

      \    return Object.keys(obj).sort().reduce((acc, key) => {\r

      \        acc[key] = sortObject(obj[key]);\r

      \        return acc;\r

      \    }, {});\r

      }\r

      \r

      // Parse XML strings into JavaScript objects\r

      xml2js.parseString(expected, (err, result1) => {\r

      \    if (err) {\r

      \        pm.test('XML parsing error for expected xml', () => {\r

      \            pm.expect(err).to.be.null;\r

      \        });\r

      \    } else {\r

      \        xml2js.parseString(actual, (err, result2) => {\r

      \            if (err) {\r

      \                pm.test('XML parsing error for actual xml', () => {\r

      \                    pm.expect(err).to.be.null;\r

      \                });\r

      \            } else {\r

      \                // Sort the objects\r

      \                const sortedObject1 = sortObject(result1);\r

      \                const sortedObject2 = sortObject(result2);\r

      \r

      \                // Compare the sorted objects\r

      \                pm.test('XML strings are equivalent, ignoring element order', () => {\r

      \                    pm.expect(sortedObject1).to.eql(sortedObject2);\r

      \                });\r

      \            }\r

      \        });\r

      \    }\r

      });"
    language: text/javascript
order: 21000
