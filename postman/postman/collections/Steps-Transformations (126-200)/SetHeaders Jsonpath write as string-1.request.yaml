$kind: http-request
name: SetHeaders Jsonpath write as string
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/SetHeaders_\
  jsonpath_as_string"
method: POST
body:
  type: json
  content: |-
    
    { "store": {
        "book": [ 
          { "category": "reference",
            "author": "Nigel Rees",
            "title": "Sayings of the Century",
            "price": 8.95
          },
          { "category": "fiction",
            "author": "Evelyn Waugh",
            "title": "Sword of Honour",
            "price": 12.99
          },
          { "category": "fiction",
            "author": "Herman Melville",
            "title": "Moby Dick",
            "isbn": "0-553-21311-3",
            "price": 8.99
          },
          { "category": "fiction",
            "author": "J. R. R. Tolkien",
            "title": "The Lord of the Rings",
            "isbn": "0-395-19395-8",
            "price": 22.99
          }
        ],
        "bicycle": {
          "color": "red",
          "price": 19.95
        }
      }
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("author", () => {
        pm.expect(pm.response.headers.get('author')).to.eql('\"Nigel Rees\"');
      });

      pm.test("color", () => {
        pm.expect(pm.response.headers.get('color')).to.eql('\"red\"');
      });

      pm.test("price", () => {
        pm.expect(pm.response.headers.get('price')).to.eql('8.95');
      });
    language: text/javascript
order: 78000
