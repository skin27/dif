$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/PdfToTxt"
method: POST
body:
  type: file
  content:
    src: pdf2txt.pdf
scripts:
  - type: afterResponse
    code: |-
      const expected = `Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut 
      labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercita9on ullamco 
      laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in 
      voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat 
      non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. `;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t]/g, "")).to.eql(expected.replace(/[\r\n\t]/g, ""));    
      });
    language: text/javascript
order: 67000
