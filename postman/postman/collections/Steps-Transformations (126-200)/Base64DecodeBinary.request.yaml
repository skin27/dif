scripts:
  - type: afterResponse
    code: |
      pm.test("Content-Type header is image/jpg", () => {
        pm.expect(pm.response.headers.get('Content-Type')).to.eql('image/png');
      });

      let responseSize=pm.response.size();
      pm.test("Verify response sizes",()=>{
          pm.expect(Number(responseSize.total)).to.below(300000);
          pm.expect(Number(responseSize.body)).to.eql(257311);
          pm.expect(Number(responseSize.header)).to.be.below(600);
          }
      );

      // pm.test("BodyLength", () => {
