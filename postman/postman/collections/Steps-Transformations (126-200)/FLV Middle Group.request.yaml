$kind: http-request
name: FLV Middle Group
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/FLV_middle_\
  group"
method: POST
body:
  type: text
  content: |-
    R1A001 Amsterdam 1234567
    R2B001 020 1234567
    R2B002 021 1234567
    R2B003 022 1234567
    R2B004 023 1234567
    R3C001 ABC 1234567
scripts:
  - type: afterResponse
    code: |-
      const xml2js = require('xml2js');

      const expected = `<flv-message>
          <rule matchOn="HDR" fields="Type[2]Regelnr[4]Content[11]Controlenr[10]" />
          <rule matchOn="R2" fields="Type[2]Regelnr[4]Content[11]Controlenr[10]" />
          <rule matchOn="R1" fields="Type[2]Regelnr[4]Content[11]Controlenr[10]" />
          <segment>
              <Type>R1</Type>
              <Regelnr>A001</Regelnr>
              <Content>Amsterdam</Content>
              <Controlenr>1234567</Controlenr>
          </segment>
          <group>
              <segment>
                  <Type>R2</Type>
                  <Regelnr>B001</Regelnr>
                  <Content>020 123456</Content>
                  <Controlenr>7</Controlenr>
              </segment>
          </group>
          <group>
              <segment>
                  <Type>R2</Type>
                  <Regelnr>B002</Regelnr>
                  <Content>021 123456</Content>
                  <Controlenr>7</Controlenr>
              </segment>
          </group>
          <group>
              <segment>
                  <Type>R2</Type>
                  <Regelnr>B003</Regelnr>
                  <Content>022 123456</Content>
                  <Controlenr>7</Controlenr>
              </segment>
          </group>
          <group>
              <segment>
                  <Type>R2</Type>
                  <Regelnr>B004</Regelnr>
                  <Content>023 123456</Content>
                  <Controlenr>7</Controlenr>
              </segment>
          </group>
      </flv-message>`;

      const actual = pm.response.text();

      // Sorteert zowel object-sleutels als de inhoud van arrays
      function canonicalSort(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              // 1. Sorteer eerst de inhoud van elk element in de array
              // 2. Sorteer daarna de array zelf op basis van de JSON-representatie
              return obj
                  .map(canonicalSort)
                  .sort((a, b) => JSON.stringify(a).localeCompare(JSON.stringify(b)));
          }

          // Sorteer de sleutels van een object alfabetisch
          return Object.keys(obj).sort().reduce((acc, key) => {
              acc[key] = canonicalSort(obj[key]);
              return acc;
          }, {});
      }

      xml2js.parseString(expected, (err, result1) => {
          if (err) {
              pm.test('XML parsing error for expected xml', () => {
                  pm.expect(err).to.be.null;
              });
          } else {
              xml2js.parseString(actual, (err, result2) => {
                  if (err) {
                      pm.test('XML parsing error for actual xml', () => {
                          pm.expect(err).to.be.null;
                      });
                  } else {
                      const sorted1 = canonicalSort(result1);
                      const sorted2 = canonicalSort(result2);

                      pm.test('XML strings are equivalent, ignoring element order', () => {
                          pm.expect(sorted1).to.eql(sorted2);
                      });
                  }
              });
          }
      });
    language: text/javascript
order: 55000
