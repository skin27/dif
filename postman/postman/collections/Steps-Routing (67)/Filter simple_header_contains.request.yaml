$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/Filter_simple_header_contains"
method: POST
headers:
  name: Boa constructor
scripts:
  - type: afterResponse
    code: |-
      const expected = `Boa constructor contains 'con'`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t]/g, "")).to.eql(expected.replace(/[\r\n\t]/g, ""));    
      });
    language: text/javascript
order: 27000
