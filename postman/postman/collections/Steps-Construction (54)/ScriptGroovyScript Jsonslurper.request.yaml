$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/ScriptGroovyScript_jsonslurper"
method: POST
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("age", () => {
        pm.expect(pm.response.headers.get('age')).to.eql('45');
      });

      pm.test("name", () => {
        pm.expect(pm.response.headers.get('name')).to.eql('John McClusky');
      });

      pm.test("city", () => {
        pm.expect(pm.response.headers.get('city')).to.eql('York');
      });
    language: text/javascript
order: 20000
