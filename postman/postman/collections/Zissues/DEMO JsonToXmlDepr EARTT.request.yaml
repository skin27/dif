  content: |-
    {
        "key": "495423p3_item-Q495423",
        "name": "495423p3_495423p3",
        "ident": "495423p3.jpg",
        "ident_org": "jpg",
        "sequence": 10002,
        "video_provider": null,
        "video_embed": false,
        "type": "additional_product_image",
        "language": null,
        "product": {
            "key": "item-Q495423",
            "origin": "wiltec"
        },
        "trees": [],
        "shop": null,
        "alt_text": null,
