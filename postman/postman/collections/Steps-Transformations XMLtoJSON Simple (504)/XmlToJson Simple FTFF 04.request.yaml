$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/XmlToJsonSi\
  mple?config=FTFF"
method: POST
queryParams:
  config: FTFF
body:
  type: text
  content: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <Formula1>
        <Drivers class="array">
            <Driver class="object">
                <Name type="string">Max Verstappen</Name>
                <Age type="number">19</Age>
            </Driver>
            <Driver class="object">
                <Name type="string">Nico Hulkenberg</Name>
                <Age type="number">30</Age>
            </Driver>
        </Drivers>
        <Teams class="array">
            <Team class="object">
                <Name type="String">Redbull Racing</Name>
                <Principal type="string">Christian Horner</Principal>
            </Team>
            <Team class="object">
                <Name type="String">Renault</Name>
                <Principal type="string">Carlos Ghosn, Jérôme Stoll, Cyril Abiteboul</Principal>
            </Team>
        </Teams>
    </Formula1>
scripts:
  - type: afterResponse
    code: |-
      const expected = JSON.parse(`{
          "Formula1": {
              "Drivers": {
                  "@class": "array",
                  "Driver": [
                      {
                          "@class": "object",
                          "Age": {
                              "@type": "number",
                              "jsonContent": 19
                          },
                          "Name": {
                              "@type": "string",
                              "jsonContent": "Max Verstappen"
                          }
                      },
                      {
                          "@class": "object",
                          "Age": {
                              "@type": "number",
                              "jsonContent": 30
                          },
                          "Name": {
                              "@type": "string",
                              "jsonContent": "Nico Hulkenberg"
                          }
                      }
                  ]
              },
              "Teams": {
                  "@class": "array",
                  "Team": [
                      {
                          "@class": "object",
                          "Principal": {
                              "@type": "string",
                              "jsonContent": "Christian Horner"
                          },
                          "Name": {
                              "@type": "String",
                              "jsonContent": "Redbull Racing"
                          }
                      },
                      {
                          "@class": "object",
                          "Principal": {
                              "@type": "string",
                              "jsonContent": "Carlos Ghosn, Jérôme Stoll, Cyril Abiteboul"
                          },
                          "Name": {
                              "@type": "String",
                              "jsonContent": "Renault"
                          }
                      }
                  ]
              }
          }
      }`);

      const actual = pm.response.json();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual).to.eql(expected);
          //pm.expect(pm.response.headers.get('Connection')).to.eql('keep-alive');    
      });
    language: text/javascript
order: 1280000
