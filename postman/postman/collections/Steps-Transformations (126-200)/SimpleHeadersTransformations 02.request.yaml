$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/SimpleHeade\
  rsTransformations_02?root=rt&array=arr&element=elmnt"
method: POST
queryParams:
  root: rt
  array: arr
  element: elmnt
body:
  type: json
  content: Simple headers in components test
scripts:
  - type: afterResponse
    code: |-
      const expected = `<?xml version="1.0" encoding="UTF-8"?>
      <root>
          <nr>1</nr>
          <name>Calvin Klein</name>
      </root>`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(expected.replace(/[\r\n\t\s]/g, ""));    
      });
    language: text/javascript
order: 85000
