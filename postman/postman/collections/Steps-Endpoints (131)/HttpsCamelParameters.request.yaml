$kind: http-request
name: HttpsCamelParameters
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/HttpsCamelParameters"
method: POST
headers:
  X-CamelFileName: EmailText.txt
body:
  type: file
  content:
    src: EmailText.txt
scripts:
  - type: afterResponse
    code: |-
      pm.test("Check X-Camel headers", () => {
        pm.expect(pm.response.headers.get('X-Camelfilename')).to.eql('EmailText.txt');
        pm.expect(pm.response.headers.get('X-Camelhttpmethod')).to.eql('POST');
        pm.expect(pm.response.headers.get('X-Camelhttpuri')).to.eql('/regressiontests/HttpsCamelParameters');
        pm.expect(pm.response.headers.get('X-Camelhttpurl')).to.eql('https://assimbly-test:9001/regressiontests/HttpsCamelParameters');
        pm.expect(pm.response.headers.get('X-Camelservletcontextpath')).to.eql('/regressiontests/HttpsCamelParameters');
      });
    language: text/javascript
order: 40785
