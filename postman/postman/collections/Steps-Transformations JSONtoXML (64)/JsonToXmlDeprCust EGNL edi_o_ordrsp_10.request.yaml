body:
  type: json
  content: |-
    {
      "limit": 1,
      "offset": 0,
      "queryCode": "DDG_EDI_GETORDERINFO",
      "queryCriteria": [
        {
          "fieldName": "Administratie",
          "fieldStringValue": "01"
