                  <samenvatting>Nederland heeft in de loop der jaren allerlei minderheden mogen verwelkomen. Sommige minderheden deden in de rechtszaal een beroep op hun cultuur of religie. Dit leidde soms tot spannende vraagstukken over de factoren die door de rechter werden meegewogen.&lt;BR/&gt;&lt;BR/&gt;In dit boek gaat Gerard Maduro in op de wijzen waarop de Nederlandse rechtspraak voorziet in een beroep op cultuur of religie door minderheden. Allereerst behandelt hij de bescherming van minderheden in het recht. Hierbij komen onder meer aan bod de vrijheid van cultuur (artikel 27 Internationaal Verdrag inzake burgerrechten en politieke rechten), de vrijheid van godsdienst (artikel 9 Europees Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden (EVRM) en artikel 6 Grondwet), en juridische beginselen, zoals de scheiding van kerk en staat en de interpretatieve terughoudendheid. Ook van belang is de Nederlandse benadering van gelijke behandeling van godsdiensten in gelijke gevallen.&lt;BR/&gt;&lt;BR/&gt;Vervolgens gaat de auteur in op de reikwijdte van artikel 9 EVRM. In religiegerelateerde zaken wordt namelijk vaak een beroep gedaan op dit artikel omdat deze bepaling rechtstreeks doorwerkt in onze nationale rechtsorde. Niet alleen de reikwijdte van deze verdragsbepaling wordt nader besproken maar ook de toepassing ervan door het Europees Hof voor de Rechten van de Mens.&lt;BR/&gt;&lt;BR/&gt;Tot slot beschrijft de auteur, aan de hand van een bespreking van civiele, bestuursrechtelijke en strafzaken, op welke wijzen rechters in Nederland al dan niet rekening houden met het beroep op cultuur of religie. In het slothoofdstuk worden enkele aanbevelingen gedaan.                                                                                                                                                                                                                                                                                                                                                                                                                  </samenvatting>
