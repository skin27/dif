$kind: http-request
description: ""
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/SQL_insert_\
  postgresql_escaped"
method: POST
headers:
  name: body
  value: '{"body":"abc\ndef"}'
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      const instance = pm.collectionVariables.get("INSTANCE");

      // 1. Converteer de XML-body naar een JavaScript-object
      const responseData = xml2Json(pm.response.text());

      // 2. Definieer de verwachte waarden per instance
      let expected = {};

      switch (instance) {
          case "acceptance":
              expected = { ResultSize: "1", value: '{\\"body\\":\\"abc\ndef\\"}' };
              break;
          case "development":
              // Dev bevat een echte enter in de XML -> na replace wordt dit \n (2 backslashes in JS code)
              expected = { ResultSize: "1", value: '{\\"body\\":\\"abc\ndef\\"}' };
              break;
          default: // voor 'next'
              // Next bevat al ge-escapede backslashes in de XML -> \\n (4 backslashes in JS code)
              expected = { ResultSize: "1", value: '{\\"body\\":\\"abc\\\\ndef\\"}' };
              break;
      }

      // 3. Valideer de XML-velden
      pm.test(`Valideer specifieke XML-velden voor ${instance}`, function () {
          // Check ResultSize
          pm.expect(responseData.ResultSet.ResultSize).to.eql(expected.ResultSize);

          // Haal de ruwe waarde op uit de XML
          let actualValue = responseData.ResultSet.Results.Result.value;

          // Normaliseer echte enters (\r\n of \n) naar een \n string
          actualValue = actualValue.replace(/\r?\n/g, "\\n");

          // Check de waarde
          pm.expect(actualValue).to.eql(expected.value);
      });
    language: text/javascript
order: 4503598275201089
