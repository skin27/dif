$kind: http-request
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/FIlter_simple_header_starts"
method: POST
headers:
  name: "1234567890"
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      const expected = `1234567890 starts with '1'`;

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.response.to.not.be.error;
          pm.expect(actual.replace(/[\r\n\t]/g, "")).to.eql(expected.replace(/[\r\n\t]/g, ""));    
      });
    language: text/javascript
order: 28000
