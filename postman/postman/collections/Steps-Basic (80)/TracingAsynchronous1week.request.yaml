$kind: http-request
name: TracingAsynchronous1week
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/TracingAsynchronous1week"
method: POST
headers:
  environment: "{{ENVIRONMENT}}"
body:
  type: json
  content: TracingAsynchronous1week
scripts:
  - type: afterResponse
    code: |-
      var instance = pm.environment.name;
      var output = "";

      switch (instance) {
          case "next":
              output = 'TracingAsynchronous1weekhasbeenremoved';
              break;
          default:
              output = '<?xml version="1.0" encoding="UTF-8"?><Enriched><employees><employee><element><job/></element><element><name>John</name><id>2</id><job>carpenter</job></element><element><name>Frank</name><id>3</id><job>mason</job></element><element><name>Max</name><id>4</id><job>painter</job></element></employee></employees></Enriched>';
              break;
      }

      const actual = pm.response.text();

      pm.test("happyflow", function () {
          pm.expect(actual.replace(/[\r\n\t\s]/g, "")).to.eql(output.replace(/[\r\n\t\s]/g, ""));  
      });
    language: text/javascript
order: 58000
