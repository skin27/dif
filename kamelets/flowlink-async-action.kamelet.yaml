apiVersion: "camel.apache.org/v1"
kind: "Kamelet"
metadata:
  name: "flowlink-async-action"
  labels:
    camel.apache.org/kamelet.type: "action"
spec:
  definition:
    title: "Async flowlink action"
    description: "Links messages to another flow (outbound) using an endpoint like async (seda)"
    type: "object"
    properties:
      transport:
        title: "Transport"
        description: "Transport"
        type: "string"
      targetFlowId:
        title: "TargetFlowID"
        description: "Flow ID of the target flow"
        type: "string"
      exchangePattern:
        title: "Exchange Pattern"
        description: "Exchange Pattern"
        type: "string"
        default: "InOut"
      requestTimeout:
        title: "Request Timeout"
        description: "Timeout in milliseconds that is waited until a reply arrives"
        type: "integer"
        default: "20000"
      in:
        title: "Source Endpoint"
        type: "string"
        default: "kamelet:source"
      out:
        title: "Sink Endpoint"
        type: "string"
        default: "mock:sink"
      sink:
        title: "Sink"
        type: "boolean"
        default: false
      routeId:
        title: "Route ID"
        type: "string"
      stepId:
        title: "Step ID"
        type: "string"
      routeConfigurationId:
        title: "Route Configuration ID"
        type: "string"
        default: "0"
  dependencies:
    - "camel:kamelet"
  template:
    route:
      routeConfigurationId: "{{routeConfigurationId}}"
      from:
        uri: "{{in}}"
        steps:
          - step:
              id: "step-{{stepId}}"
              steps:
                - toD:
                    uri: "{{transport}}:{{targetFlowId}}?exchangePattern={{exchangePattern}}&timeout={{requestTimeout}}&blockWhenFull=true&size=10000"
                - to:
                    disabled: "{{sink}}"
                    uri: "{{out}}"