method: POST
scripts:
  - type: afterResponse
    code: "const expected = `Message Body:\r

      \r

      <persons>\r

      \t<person>\r

      \t\t<name>Bill Doe</name>\r

      \t</person>\r

      \t<person>\r

      \t\t<name>Milly Doe</name>\r

      \t</person>\r

      </persons>`;\r

      \r

      const actual = pm.response.text();\r

      \r

      pm.test(\"happyflow\", function () {\r

      \    pm.response.to.not.be.error;\r

      \    pm.expect(actual).to.eql(expected);    \r

      });"
    language: text/javascript
order: 12000
