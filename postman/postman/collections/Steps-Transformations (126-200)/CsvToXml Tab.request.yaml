$kind: http-request
name: CsvToXml Tab
url: "{{HOST}}://{{INSTANCE}}.{{BASE_URI}}/{{ENVIRONMENT}}/{{PATH}}/CsvToXml_tab"
method: POST
body:
  type: text
  content: |-
    ID	Name	Number
    1	Peter	1001
    2	John	1002
    3	Frank	1003
    4	Max	1004
scripts:
  - type: afterResponse
    code: |-
      //WORKAROUND IN THE FLOW

      // Import the xml2js library
      const xml2js = require('xml2js');

      const expected = `<?xml version="1.0" encoding="UTF-8"?>
      <items>
          <item>
              <ID>1</ID>
              <Name>Peter</Name>
              <Number>1001</Number>
          </item>
          <item>
              <ID>2</ID>
              <Name>John</Name>
              <Number>1002</Number>
          </item>
          <item>
              <ID>3</ID>
              <Name>Frank</Name>
              <Number>1003</Number>
          </item>
          <item>
              <ID>4</ID>
              <Name>Max</Name>
              <Number>1004</Number>
          </item>
      </items>`;

      const actual = pm.response.text();

      // Function to sort the elements in a JavaScript object
      function sortObject(obj) {
          if (typeof obj !== 'object' || obj === null) {
              return obj;
          }

          if (Array.isArray(obj)) {
              return obj.map(sortObject);
          }

          return Object.keys(obj).sort().reduce((acc, key) => {
              acc[key] = sortObject(obj[key]);
              return acc;
          }, {});
      }

      // Parse XML strings into JavaScript objects
      xml2js.parseString(expected, (err, result1) => {
          if (err) {
              pm.test('XML parsing error for expected xml', () => {
                  pm.expect(err).to.be.null;
              });
          } else {
              xml2js.parseString(actual, (err, result2) => {
                  if (err) {
                      pm.test('XML parsing error for actual xml', () => {
                          pm.expect(err).to.be.null;
                      });
                  } else {
                      // Sort the objects
                      const sortedObject1 = sortObject(result1);
                      const sortedObject2 = sortObject(result2);

                      // Compare the sorted objects
                      pm.test('XML strings are equivalent, ignoring element order', () => {
                          pm.expect(sortedObject1).to.eql(sortedObject2);
                      });
                  }
              });
          }
      });
    language: text/javascript
order: 14000
